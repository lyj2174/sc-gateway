server:
  port: 9000

spring:
  application:
    name: only-apigateway-service

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: hello_route
              uri: http://localhost:8765
              predicates:
                - Path=/hello
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: DEBUG
    org.springframework.web.reactive: DEBUG